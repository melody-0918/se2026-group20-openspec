[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "guided-notes-classroom-quiz"
version = "0.1.0"
description = "Local classroom quiz foundation"
requires-python = ">=3.13"
dependencies = [
    "Flask>=3.1,<4",
    "google-api-python-client>=2,<3",
    "google-auth>=2,<3",
    "google-auth-oauthlib>=1,<2",
    "httplib2>=0.22,<1",
    "oauthlib>=3,<5",
    "requests>=2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
include = ["guided_notes*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
