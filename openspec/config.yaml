schema: spec-driven

context: |
  Language: zh-TW
  All artifacts must be written in zh-TW.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

  ## 專案背景
  - 課程：NCU SE6005 2026 軟體工程期末專題「Vibe Coding 課堂搶答系統」。
  - 本 repo 為第 20 組的 OpenSpec 小組（2 人）。同大組另有 SpecKit 小組，
    兩小組產出的使用者功能必須一致；任何功能或規則變更須先與 SpecKit 組確認，
    並更新兩組的共同需求文件。
  - 情境：老師在課堂用填空式學習單（Guided Notes）進行搶答，原本請學生上台寫黑板，
    改為線上進行。
  - 繳交期限：2026-11-30 00:00。

  ## 作業規定的核心功能（必做）
  - 使用者分為老師與學生兩種身分，學生以「組別」為單位作答與送出。
  - 老師可以：匯入 Guided Notes（題數與題號須與原檔一致，不需匯入題目敘述）、
    開啟與結束搶答、檢視作答狀況與搶答結果、
    將搶答成功組別的答案匯出回原 Guided Notes 對應題目的填空格。
  - 學生可以：搶答開始後作答、依組別送出答案、搶答結束後檢視結果。
  - 搶答結束前，學生看不到其他組別的作答狀況。
  - 最快搶答的組別為該題搶答成功的答案。
  - 所有使用者的活動階段必須同步。

  ## 額外功能（選做）
  - 題組（同一題號下多個填空須同時送出）、匯出活動結果至 CSV（題號、組別答案、搶答順位）、
    更公平的搶答順位機制、其他提升活動品質的功能。

  ## Guided Notes 格式
  - 以 Google Sheets 儲存。作業提供「單題」與「題組+單題」兩份範本。
  - 範本有表頭列「題號／題目／作答」；單題每題一列；題組為一個題號佔多列，
    後續列的題號格留空，作答格內含「（1）」「（2）」等小題標籤。
  - 一律為簡答題。

  ## 硬性限制
  - 禁止以靜態方式匯入／匯出 Guided Notes（例如寫死「第一題寫到 G5」）；
    助教會用另一份 Guided Notes 測試，必須動態辨識題號與填空格位置。
  - 禁止在文件、程式碼或 repo 中出現密碼、金鑰、憑證或任何機敏資料；
    機敏設定一律放在 .env 或已列入 .gitignore 的檔案，並在 README 說明設定方式。
  - 只需在本機執行與模擬，不需架設可供其他裝置連線的伺服器；
    以多個瀏覽器視窗模擬老師與至少 2 個組別。
  - 程式由 AI 代理產生；AI 自動驗證之外，必須保留人工驗證步驟。

  ## 技術堆疊
  - 待與 SpecKit 組確認後補上（語言、框架、Google Sheets 存取方式、即時同步方式）。

  ## 協作慣例
  - main 受保護：每個 OpenSpec change 使用一個功能分支，完成 verify 後發 PR，
    由另一位組員審查通過才合併。
  - commit 訊息簡短描述做了什麼。

rules:
  proposal:
    - 明確列出 Out of Scope（本次不做的事）
    - 標示哪些項目是作業規定、哪些是與 SpecKit 組共同約定、哪些是本組自行決定的預設
  specs:
    - 每個 Requirement 至少有一個 WHEN/THEN Scenario，描述可觀察的結果
    - 不把框架、資料庫等實作選擇寫成需求
  design:
    - 必須說明 Guided Notes 如何動態辨識題號、題組與填空格，以及回填時如何避免覆蓋小題標籤
    - 必須說明機敏設定（金鑰、教師密碼）如何存放且不進入 repo
  tasks:
    - 每項 task 附上驗證方式（自動測試或人工操作步驟）
    - 包含至少一項以「不同版面的 Guided Notes」測試匯入與回填的人工驗證 task
skillsScope: project
