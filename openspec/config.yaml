schema: spec-driven

context: |
  Language: zh-TW
  All artifacts must be written in zh-TW.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

  ## 專案背景
  - 課程：NCU SE6005 2026 軟體工程期末專題「Vibe Coding 課堂搶答系統」。
  - 本 repo 為第 20 組的 OpenSpec 小組（2 人）。同大組的 SpecKit 小組 repo 為
    Afra0704/se2026-group20-speckit。兩小組產出的使用者功能必須一致；
    任何功能或規則變更須先與 SpecKit 組確認，並更新共同需求文件。
  - 共同需求的唯一依據：SpecKit repo 的 docs/shared-requirements.md
    （需求編號 R01–R11、D 系列決策、驗收情境 A01–A08）。
    本專案文件引用規則時，一律標註這些編號。
  - 情境：老師在課堂用填空式學習單（Guided Notes）進行搶答，原本請學生上台寫黑板，
    改為線上進行。
  - 繳交期限：2026-11-30 00:00（Asia/Taipei）。

  ## 作業規定的核心功能（必做，R01–R11）
  - 使用者分為老師與學生兩種身分，學生以「組別」為單位作答與送出。
  - 老師可以：匯入 Guided Notes（題數與題號須與原檔一致，不需匯入題目敘述）、
    開啟與結束搶答、檢視作答狀況與搶答結果、
    將搶答成功組別的答案匯出回原 Guided Notes 對應題目的填空格。
  - 學生可以：搶答開始後作答、依組別送出答案、搶答結束後檢視結果。
  - 搶答結束前，學生看不到其他組別的作答狀況。
  - 最快搶答的組別為該題搶答成功的答案。
  - 所有使用者的活動階段必須同步。

  ## 兩組已確認的行為規則
  - D01 同組同題可主動重送；新答案成功受理才取代舊答案與舊順位。同一次已受理送答的重試
    回覆原受理結果，不改變目前有效答案及順位。
  - D03 階段：準備中 → 搶答中 → 已結束；已結束不可重開。結束前都可加入，加入即可看題；
    只有搶答中受理答案。
  - D02 截止及排序：只有系統確認結束前已成功受理的答案才計入；以伺服器成功受理的唯一順序排名，
    同組同題答案替換後依新的受理順序計算。
  - D04 身分：教師獨立登入，只能管理自己的活動；學生輸入加入碼並自填組名，
    同一範圍內相同組名視為同一組。
  - D05 辨識：見下方「Guided Notes 格式」。
  - D06 公布：結束並結算後，教師看所有組別每題的答案、順位與勝組；
    學生看每題勝組名稱與答案，加上自己組的答案與順位。
  - D07 例外：無人作答的題目回填時略過；來源變動時重建預覽並再次確認；
    題目集合改變須重新匯入。
  - D08 勝組為該題有效提交中順位第一組，答案由教師講評。
  - D09 恢復：授權有效時重整／重連恢復原活動與組別；結束後須在同一瀏覽器保有
    原加入證明才能恢復，換裝置或清除紀錄則無法恢復。回填後須回讀確認：
    內容相同視為完成，不同則提示衝突。
  - D10 題組：每個題號是一題，也是一個提交單位；題組的所有小題一起送出，
    整組只有一個順位與一個勝組。題數、提交單位數、作答格數分開計算。
  - D11 版本：建立活動時固定匯入清單版本與題目識別；新版本須建立新活動。
  - D12–D16 課堂流程：教師在自己的課程中重複使用講義；每次上課建立一間有獨立加入碼
    的課堂；學生加入一次，同堂切換活動時沿用組別；同一課堂同時最多一個搶答中的活動；
    關課時一併結束進行中的活動、停止加入與提交、保留歷史與回填資料；
    教師先選課程，再匯入或選擇該課程的講義版本；關課後既有學生可在原瀏覽器查看
    同堂已結算活動的結果。
  - D19 活動建立後學生可讀取固定版本的完整題目和小題純文字，開始後才可作答。
    題組仍整組提交，來源答案不得公開。此為雙組功能約定。
  - 額外功能「題組匯入與整組提交」兩組已確認納入。

  ## 尚待兩組確認（先採 SpecKit 建議值作為預設，文件中須標示「待確認」）
  - D17：匯入一個分頁時，教師可沿用來源分頁名稱或自訂講義名稱，並顯示原始來源資訊；
    多分頁逐一選擇、預覽、保存，不自動合併。
  - CSV 結果匯出（額外功能）：匯出題號、組別答案、搶答順位與勝組。

  ## Guided Notes 格式（D05，依 SpecKit 的 Format Contract v1）
  - 以 Google Sheets 儲存，一律為簡答題。作業提供「單題」與「題組＋單題」兩份範本。
  - 在同一列找「題號」「題目」「作答」三個表頭（去除前後空白後比對，可跨欄合併）；
    缺少或重複時回報錯誤，不得猜測。
  - 題號欄內的原始正整數值或純數字字串為一題，保留合法題號的顯示文字。
    題號儲存格跨列合併時，合併範圍就是該題的列範圍；
    不得把下一列空白的題號自動補成同一題。
  - 小題標號為「(1)」「（1）」等格式，接受半形、全形括號和括號內空白。題組含至少兩個
    不重複的標號，答案區在標號同列右方、作答欄區內。單題須有唯一涵蓋全題的答案格。
    合併答案寫入左上角儲存格。
  - 寫入時不得合併／取消合併儲存格或改變格式，不得覆蓋小題標號。
  - 來源只移動位置或改欄寬時，必須能重新辨識同一題與小題。

  ## 硬性限制
  - 禁止以靜態方式匯入／匯出 Guided Notes（例如寫死「第一題寫到 G5」）；
    助教會用另一份 Guided Notes 測試，必須動態辨識題號與填空格位置。
  - 禁止在文件、程式碼或 repo 中出現密碼、金鑰、憑證或任何機敏資料；
    Google OAuth client 檔與 token 必須放在 repo 外，以環境變數指定路徑。
  - 只需在本機執行與模擬，不需架設可供其他裝置連線的伺服器；
    以多個瀏覽器視窗模擬老師與至少 2 個組別。
  - 程式由 AI 代理產生；AI 自動驗證之外，必須保留人工驗證步驟。

  ## 技術堆疊（與 SpecKit 組一致）
  - Python 3.13、Flask、Jinja、原生 JavaScript、SQLite；本機執行。
  - 同步方式：前端約每 1 秒輪詢，目標在 2 秒內更新。
  - Google Sheets：使用官方 google-api-python-client 與 OAuth Desktop app 授權，
    scope 為 https://www.googleapis.com/auth/spreadsheets（需讀寫）。
    環境變數 NOTES_GOOGLE_CLIENT_SECRETS、NOTES_GOOGLE_TOKEN 指定 repo 外的檔案路徑。
    一般 HTTP 請求不得彈出 Google 登入；token 失效時提示教師重新執行授權指令。
  - 回填完成以回讀儲存格內容確認，HTTP 成功本身不算完成。

  ## 模組與分工
  - 模組劃分與 SpecKit 組對應：
    notes（匯入、辨識、回填，對應 SpecKit 001）、
    activities（身分、活動階段、課程與課堂，對應 SpecKit 002／004）、
    quiz（作答提交、順位、結算與結果，對應 SpecKit 003）。
  - 組員 A 負責 notes 與 CSV 匯出；組員 B 負責 activities 與 quiz。
    共用的 Flask app、設定、教師登入、資料庫由 B 先建立，A 的 notes 以 Blueprint 接入。
  - 每個模組使用獨立的 OpenSpec change 與功能分支，模組間以明確的函式／資料介面溝通。

  ## 協作慣例
  - main 受保護：每個 OpenSpec change 使用一個功能分支，完成 verify 後發 PR，
    由另一位組員審查通過才合併。
  - commit 訊息簡短描述做了什麼。

rules:
  proposal:
    - 明確列出 Out of Scope（本次不做的事）
    - 標示每條規則的來源：作業規定（R 編號）、兩組已確認（D 編號）、待確認（D 編號，採預設值）或本組自行決定
  specs:
    - 每個 Requirement 至少有一個 WHEN/THEN Scenario，描述可觀察的結果
    - Requirement 標註對應的 R／D 編號，方便與 SpecKit 組比對功能是否一致
    - 不把框架、資料庫等實作選擇寫成需求
  design:
    - 必須說明與其他模組的介面（輸入、輸出、錯誤代碼）
    - notes 相關設計必須說明如何動態辨識題號、題組與填空格，以及回填時如何避免覆蓋小題標號
    - 必須說明機敏設定（OAuth 檔案、教師密碼、secret key）如何存放且不進入 repo
  tasks:
    - 每項 task 附上驗證方式（自動測試或人工操作步驟）
    - 涉及 Guided Notes 的 change，須包含以「不同版面的 Guided Notes」測試匯入與回填的人工驗證 task
skillsScope: project
